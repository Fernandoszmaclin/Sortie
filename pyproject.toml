[project]
name            = "sortie"
version         = "0.1.0.dev0"
description     = "Banco de ensaio para análise comparativa de execuções de missão em veículos autônomos"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "PySide6-Essentials>=6.11.1,<6.12",
    "pymavlink>=2.4.49,<3.0",
    "pyqtgraph>=0.14.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
    "pytest-cov>=5.0",
    "psutil>=6.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1,<3",
    "import-linter>=2.13",
    "pyinstaller>=6.22.1,<7",
]

[tool.uv]
# Aplicação, não biblioteca: gerencia o venv sem instalar o projeto.
package = false

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name       = "A6 - regra de dependencia entre pacotes"
type       = "layers"
containers = ["app"]
# Cada camada importa apenas as abaixo dela. O '|' torna os dois irmãos.
layers = [
    "ui",
    "services",
    "core",
    "adapters | database",
    "models",
]
# Falha se um pacote novo aparecer sob app/ sem camada atribuída.
exhaustive         = true
exhaustive_ignores = ["main"]

[tool.pytest.ini_options]
# Põe a raiz do repositório no sys.path; sem isto `import app` falha.
pythonpath = ["."]
qt_api     = "pyside6"
addopts    = '-m "not sitl" --strict-markers'
testpaths  = ["tests"]
markers = [
    "sitl: exige SITL rodando",
    "soak: teste longo, roda apenas no nightly",
]

[tool.coverage.run]
source = ["app"]
omit   = ["app/ui/*"]

[tool.coverage.report]
# Sobe para 80 ao fim do Bloco B.
fail_under = 0

[tool.ruff]
line-length    = 100
target-version = "py312"
# O ruff formata blocos de código em Markdown; os de docs/ são ilustrativos.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.monotonic".msg    = "Resolucao de 15,6 ms no Windows. Use Clock.perf_ns() (ADR 0013)."
"time.monotonic_ns".msg = "Resolucao de 15,6 ms no Windows. Use Clock.perf_ns() (ADR 0013)."
"os.fork".msg           = "Nao existe no Windows. Use multiprocessing spawn-safe (C6)."
"os.system".msg         = "Use subprocess com lista de argumentos, sem shell=True (C10)."

[tool.ruff.lint.per-file-ignores]
"app/models/clock.py" = ["TID251"]
"tests/*"             = ["S"]

[tool.mypy]
python_version        = "3.12"
# Escopo aqui, e nao na linha do workflow: main.py e a raiz de composicao, e
# deixar o ponto de entrada fora do verificador contradiz A6 e o ruff.
files                 = ["app", "main.py"]
warn_unused_configs   = true
disallow_untyped_defs = true
warn_return_any       = true

[[tool.mypy.overrides]]
module                = "app.ui.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module                 = ["pymavlink.*", "pyqtgraph.*"]
ignore_missing_imports = true
